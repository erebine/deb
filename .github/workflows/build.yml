---
# Builds .deb packages from the latest stable Erebine/binaries release
# (or the tag given at dispatch) and attaches them to a matching release
# in this repository.
name: Build Debian packages

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Erebine/binaries release tag to package (default latest stable)
        required: false
        type: string

jobs:
  build:
    name: Build and release debs (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          #- ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(curl -fsSL https://api.github.com/repos/Erebine/binaries/releases/latest \
              | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          fi
          [ -n "$TAG" ] || { echo "could not resolve the latest release tag"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: make build TAG="${{ steps.tag.outputs.tag }}"

      - name: Publish packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # The trailing view absorbs create races between matrix jobs.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --notes "Erebine Debian packages for binaries release $TAG" || \
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1
          # A copy of every package under an unversioned name, so an install
          # can fetch releases/latest/download/erectl_amd64.deb without
          # looking a version up first. Copied and not renamed: the versioned
          # filename is uploaded beside it and stays the way to pin.
          #
          # The architecture stays in the alias and must not be simplified
          # out of it. Every runner in the matrix uploads to this one release
          # and --clobber lets the last write win in silence, so the moment
          # the arm64 row above is uncommented a shared arch-less name would
          # have that job replace the amd64 package with a binary that will
          # not run on the machine that fetched it.
          #
          # A Debian filename is name_version_arch.deb, and neither a package
          # name nor a version may contain an underscore: the name is
          # everything before the first one and the architecture everything
          # after the last, so the digits and hyphens in between cannot be
          # mistaken for either.
          mkdir -p build/generic
          for deb in build/*.deb; do
            base="${deb##*/}"
            cp "$deb" "build/generic/${base%%_*}_${base##*_}"
          done
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            build/*.deb build/generic/*.deb
